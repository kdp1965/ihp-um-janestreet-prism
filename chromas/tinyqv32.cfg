title: "TinyQV PRISM 32-state / 128-bit STEW (fracturable, dual compare)"
version: "1.0"
fracturable: false

# Matches src/user_peripherals/prism/prism.v with DEPTH=32, INPUTS=32,
# OUTPUTS=21, STATE_INPUTS=6, INPUT_BITS=5, LUT_SIZE=3, DUAL_COMPARE=1,
# COND_OUT=2, COND_LUT_SIZE=2 (RAM_WIDTH = 128).
#
# Item ORDER is what the compiler keys on (comments in older cfgs were
# misleading): the first jmp/out/cfg items belong to decision tree 0 (the
# "if" - highest priority), the second to tree 1 ("else if"), the last out
# item is the default ("else") outputs, and the trailing cfg items are the
# conditional-output LUTs.  Offsets follow the RTL field map:
#
#   [  0]      inc            [ 30: 1]  mux0..mux5 select (5 bits each)
#   [ 35:31]   jump_to tree1  [ 40:36]  jump_to tree0
#   [ 61:41]   default outputs
#   [ 82:62]   tree1 outputs  [103:83]  tree0 outputs
#   [111:104]  tree0 LUT3     [119:112] tree1 LUT3
#   [123:120]  cond0 LUT2     [127:124] cond1 LUT2
#
# Mux wiring in the RTL (keep in sync with prism.v GEN_LUT_INPUTS / COND_OUT_GEN):
#   tree0 LUT inputs = mux 0,1,2   tree1 LUT inputs = mux 3,4,5
#   cond0 inputs     = mux 1,4     cond1 inputs     = mux 3,5
# Virtual wires 0-5 map to muxes 0-5 one to one; the wiremap only has to
# place the conditional-output wires 6-9.

muxes: { size: 5, count: 6 }
wiremap: [
	[  6, 1 ],
	[  7, 4 ],
	[  8, 3 ],
	[  9, 5 ],
]
decision-tree: {
	static-components: [                       # highest priority first
		{ type:"lut", size:3, offset:0 },      # tree0: wires 0,1,2 -> mux 0,1,2
		{ type:"lut", size:3, offset:3 },      # tree1: wires 3,4,5 -> mux 3,4,5
	],
	conditional-components: [
		{ type:"lut", size:2, offset:6 },      # cond0: wires 6,7 -> mux 1,4
		{ type:"lut", size:2, offset:8 },      # cond1: wires 8,9 -> mux 3,5
	]
}
stew: {
	count: 32,
	size: 128,
	# Layout by consumer, not by field (branch stew-remap, 2026-09-22).  Each
	# 32-bit CFGMEM bank feeds one part of the machine so the mouth wires
	# terminate next to the macros instead of crossing the tile:
	#   bank 0 (bits  0- 31): inc, the six input-mux selects, tree1 jump[0]
	#   bank 1 (bits 32- 63): tree1 jump[4:1], tree0 jump, both LUT3s, cond0,
	#                         the three OUT_LATCH legs (61 tree0, 62 tree1, 63 default)
	#   bank 2 (bits 64- 95): cond1[1:0], then outputs 0-3, 5, 12-15, 19
	#   bank 3 (bits 96-127): cond1[3:2], then outputs 6-11, 16-18, 20
	# Inside banks 2 and 3 an output's three transition legs are adjacent
	# ({tree0, tree1, default} at 3 consecutive bits) so the lo/hi and mode
	# muxes of one output sit within a few microns of its macro pins.  The
	# cond1 bits are at the low end of the words, the end nearest the tile
	# centre on the right-hand macros.  Output numbers are unchanged.
	#   out  name                               tree0 tree1 default
	#    0 pin_out[0]                            66  67  68
	#    1 pin_out[1]                            69  70  71
	#    2 pin_out[2]                            72  73  74
	#    3 pin_out[3]                            75  76  77
	#    4 OUT_LATCH                             61  62  63
	#    5 OUT_FIFO_WR_RD                        78  79  80
	#    6 OUT_COUNT1_INC_DEC                    98  99 100
	#    7 OUT_COUNT1_CLEAR_LOAD                101 102 103
	#    8 OUT_SHIFT                            104 105 106
	#    9 OUT_COUNT2_INC                       107 108 109
	#   10 OUT_COUNT2_DEC                       110 111 112
	#   11 OUT_COUNT2_CLEAR                     113 114 115
	#   12 OUT_CRC_CLEAR                         81  82  83
	#   13 OUT_CRC_UPDATE                        84  85  86
	#   14 OUT_HOST_INTERRUPT                    87  88  89
	#   15 OUT_SEMA_CLEAR / OUT_FIFO_PUSH_POP    90  91  92
	#   16 OUT_COMM_LOAD                        116 117 118
	#   17 OUT_LOAD_CRC                         119 120 121
	#   18 OUT_K_SEL0                           122 123 124
	#   19 OUT_SEMA_SET / OUT_FLAG2              93  94  95
	#   20 OUT_K_SEL1                           125 126 127
	# The RTL decode (prism.v, between the STEW MAP markers) is generated
	# from this table by stew_map.py: keep the two in step with `make stew-map`.
	items: [
		{ type:"inc", offset:   0, size:  1 },
		{ type:"mux", offset:   1, size: 30 },
		{ type:"jmp", offset:  36, size:  5 },   # tree0 jump target
		{ type:"jmp", offset:  31, size:  5 },   # tree1 jump target (bit 0 lands in bank 0)
		{ type:"out", bits: [  66,  69,  72,  75,  61,  78,  98, 101, 104, 107, 110, 113,  81,  84,  87,  90, 116, 119, 122,  93, 125 ] },   # tree0 transition outputs, out 0..20
		{ type:"out", bits: [  67,  70,  73,  76,  62,  79,  99, 102, 105, 108, 111, 114,  82,  85,  88,  91, 117, 120, 123,  94, 126 ] },   # tree1 transition outputs
		{ type:"out", bits: [  68,  71,  74,  77,  63,  80, 100, 103, 106, 109, 112, 115,  83,  86,  89,  92, 118, 121, 124,  95, 127 ] },   # default outputs (must be last)
		{ type:"cfg", offset:  41, size:  8 },   # tree0 LUT3
		{ type:"cfg", offset:  49, size:  8 },   # tree1 LUT3
		{ type:"cfg", offset:  57, size:  4 },   # cond0 LUT2
		{ type:"cfg", bits: [ 64, 65, 96, 97 ] }, # cond1 LUT2, two bits in each right-hand bank
	]
}
