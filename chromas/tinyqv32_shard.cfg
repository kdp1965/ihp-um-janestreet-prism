title: "TinyQV PRISM 16-state shard of the 128-bit STEW PRISM (fractured mode)"
version: "1.0"
fracturable: false

# Matches src/user_peripherals/prism/prism.v with DEPTH=32, INPUTS=32,
# OUTPUTS=21, STATE_INPUTS=6, INPUT_BITS=5, LUT_SIZE=3, DUAL_COMPARE=1,
# COND_OUT=2, COND_LUT_SIZE=2 (RAM_WIDTH = 128).
#
# Item ORDER is what the compiler keys on (comments in older cfgs were
# misleading): the first jmp/out/cfg items belong to decision tree 0 (the
# "if" - highest priority), the second to tree 1 ("else if"), the last out
# item is the default ("else") outputs, and the trailing cfg items are the
# conditional-output LUTs.  Offsets follow the RTL field map:
#
#   [  0]      inc            [ 30: 1]  mux0..mux5 select (5 bits each)
#   [ 35:31]   jump_to tree1  [ 40:36]  jump_to tree0
#   [ 61:41]   default outputs
#   [ 82:62]   tree1 outputs  [103:83]  tree0 outputs
#   [111:104]  tree0 LUT3     [119:112] tree1 LUT3
#   [123:120]  cond0 LUT2     [127:124] cond1 LUT2
#
# Mux wiring in the RTL (keep in sync with prism.v GEN_LUT_INPUTS / COND_OUT_GEN):
#   tree0 LUT inputs = mux 0,1,2   tree1 LUT inputs = mux 3,4,5
#   cond0 inputs     = mux 1,4     cond1 inputs     = mux 3,5
# Virtual wires 0-5 map to muxes 0-5 one to one; the wiremap only has to
# place the conditional-output wires 6-9.

muxes: { size: 5, count: 6 }
wiremap: [
	[  6, 1 ],
	[  7, 4 ],
	[  8, 3 ],
	[  9, 5 ],
]
decision-tree: {
	static-components: [                       # highest priority first
		{ type:"lut", size:3, offset:0 },      # tree0: wires 0,1,2 -> mux 0,1,2
		{ type:"lut", size:3, offset:3 },      # tree1: wires 3,4,5 -> mux 3,4,5
	],
	conditional-components: [
		{ type:"lut", size:2, offset:6 },      # cond0: wires 6,7 -> mux 1,4
		{ type:"lut", size:2, offset:8 },      # cond1: wires 8,9 -> mux 3,5
	]
}
stew: {
	count: 16,
	size: 128,
	items: [
		{ type:"inc", offset:   0, size:  1 },
		{ type:"mux", offset:   1, size: 30 },
		{ type:"jmp", offset:  36, size:  5 },   # tree0 jump target
		{ type:"jmp", offset:  31, size:  5 },   # tree1 jump target
		{ type:"out", offset:  83, size: 21 },   # tree0 transition outputs
		{ type:"out", offset:  62, size: 21 },   # tree1 transition outputs
		{ type:"out", offset:  41, size: 21 },   # default outputs (must be last)
		{ type:"cfg", offset: 104, size:  8 },   # tree0 LUT3
		{ type:"cfg", offset: 112, size:  8 },   # tree1 LUT3
		{ type:"cfg", offset: 120, size:  4 },   # cond0 LUT2
		{ type:"cfg", offset: 124, size:  4 },   # cond1 LUT2
	]
}
