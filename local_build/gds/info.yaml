# Tiny Tapeout project information
project:
  title:        "PRISM with Risc-V (TinyQV) SoC"      # Project title
  author:       "Ken Pettit with Michael Bell's TinyQV"      # Your name
  discord:      "busy_courgette_50064"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A PRISM controller suported by a TinyQV Risc-V SoC"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     64000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pettit_js_prism"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "peripherals.v"
    - "user_peripherals/uart/peri_uart.v"
    - "user_peripherals/uart/uart_rx.v"
    - "user_peripherals/uart/uart_tx.v"
    - "user_peripherals/prism/prism_periph.v"
    - "user_peripherals/prism/prism_datapath.v"
    - "user_peripherals/prism/prism_fifo.v"
    - "user_peripherals/prism/prism_sram_fifo.v"
    - "user_peripherals/prism/prism_trace_port.v"
    - "user_peripherals/prism/prism_mrx.v"
    - "user_peripherals/prism/sram_2048x32_bb.v"
    - "user_peripherals/prism/prism_crc.v"
    - "user_peripherals/prism/latch_shift_reg.v"
    - "user_peripherals/prism/latch_loader.v"
    - "user_peripherals/prism/prism.v"
    - "user_peripherals/prism/prism_sr_sit.v"
    - "user_peripherals/prism/prism_latch_sit.v"
    - "user_peripherals/prism/prism_latch_reg.v"
    - "user_peripherals/cfgmem/cfgmem_periph.v"
    - "tinyQV/cpu/tinyqv.v"
    - "tinyQV/cpu/alu.v"
    - "tinyQV/cpu/core.v"
    - "tinyQV/cpu/counter.v"
    - "tinyQV/cpu/cpu.v"
    - "tinyQV/cpu/decode.v"
    - "tinyQV/cpu/mem_ctrl.v"
    - "tinyQV/cpu/qspi_ctrl.v"
    - "tinyQV/cpu/register.v"
    - "tinyQV/cpu/latch_reg.v"
    - "tinyQV/cpu/time.v"
    - "tinyQV/peri/uart/uart_tx.v"


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Interrupt 0"
  ui[1]: "Interrupt 1"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: "UART RX"

  # Outputs
  uo[0]: "UART TX"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: "Debug UART TX"
  uo[7]: "Debug signal / PWM"

  # Bidirectional pins
  uio[0]: "Flash CS"
  uio[1]: "SD0"
  uio[2]: "SD1"
  uio[3]: "SCK"
  uio[4]: "SD2"
  uio[5]: "SD3"
  uio[6]: "RAM A CS"
  uio[7]: "RAM B CS / PWM"

# Do not change!
yaml_version: 6
