name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        # Fork of TinyTapeout/tt-gds-action@ihp-cmos5l with the PDK install
        # fixed for the IHP-Open-PDK dev branch that now vendors ihp-sg13cmos5l
        uses: kdp1965/tt-gds-action@ihp-cmos5l-fix
        with:
          pdk: ihp-sg13cmos5l
          # Same LibreLane (and OpenROAD) as the local nix flow: the action's
          # default 3.0.0rc1 routes differently and did not converge in 6 h
          # on the same placement; 3.0.2's image is built from the same nix
          # derivations as the development shells, so the runner replays
          # the route found on the 48-core box (docs 4z.7).
          librelane-version: 3.0.2
          # htfab/tt-support-tools@cmos has no 8x4 template for CMOS5L; this
          # branch is that tree plus tt_8x4/ (see tt_8x4/README.md)
          tools-repo: kdp1965/tt-support-tools
          tools-ref: cmos-8x4

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l
        with:
          tools-repo: kdp1965/tt-support-tools
          tools-ref: cmos-8x4

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: kdp1965/tt-gds-action/gl_test@ihp-cmos5l-fix

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
